id          = "credence473/window-strip"
name        = "Niri Window Strip"
version     = "0.1.1"
plugin_api  = 9
author      = "credence473"
description = "Niri windows in column order with the focused window title"
icon        = "layout-columns"

dependencies = ["niri"]

[[widget]]
id    = "dock"
entry = "windows.luau"

    [[widget.setting]]
    key         = "icon_size"
    label_key   = "settings.icon_size.label"
    description_key   = "settings.icon_size.description"
    type        = "int"
    default     = 20
    min         = 12
    max         = 64
    
    [[widget.setting]]
    key         = "icon_gap"
    type        = "int"
    label_key   = "settings.icon_gap.label"
    description_key = "settings.icon_gap.description"
    default     = 2
    min         = 0
    max         = 32
    
    [[widget.setting]]
    key         = "window_gap"
    type        = "int"
    label_key   = "settings.window_gap.label"
    description_key = "settings.window_gap.description"
    default     = 8
    min         = 0
    max         = 32
    
    [[widget.setting]]
    key         = "title_max_width"
    type        = "int"
    label_key   = "settings.title_max_width.label"
    description_key = "settings.title_max_width.description"
    default     = 260
    min         = 0
    max         = 1000
